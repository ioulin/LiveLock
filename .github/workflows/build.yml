name: Build Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build_log.txt

      - name: Run Unit Tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee test_log.txt

      - name: Dump build log tail to summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Build log tail"
            echo '```'
            tail -n 150 build_log.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push build log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          git config user.name "ci-log-bot"
          git config user.email "actions@github.com"
          git checkout --detach
          git add -f build_log.txt
          git commit -m "ci log" || echo "no log to commit"
          git push origin HEAD:ci-logs --force

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_log.txt
            test_log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
